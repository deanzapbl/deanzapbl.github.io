<style>
.sponsor-section{padding:3rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--black);overflow:hidden}
.sponsor-section-label{font-family:'IBM Plex Mono',monospace;font-size:.48rem;letter-spacing:.25em;text-transform:uppercase;color:rgba(245,243,239,.25);text-align:center;margin-bottom:2rem;display:flex;align-items:center;justify-content:center;gap:1.5rem}
.sponsor-section-label::before,.sponsor-section-label::after{content:'';width:80px;height:1px;background:rgba(245,243,239,.1)}
.sponsor-wrap{overflow:hidden;position:relative}
.sponsor-wrap::before,.sponsor-wrap::after{content:'';position:absolute;top:0;bottom:0;width:120px;z-index:2;pointer-events:none}
.sponsor-wrap::before{left:0;background:linear-gradient(90deg,#050505,transparent)}
.sponsor-wrap::after{right:0;background:linear-gradient(270deg,#050505,transparent)}
.sponsor-track{display:flex;align-items:center;gap:1px;width:max-content;animation:sponsorScroll 32s linear infinite}
.sponsor-track.paused{animation-play-state:paused}
@keyframes sponsorScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.sponsor-logo{flex-shrink:0;width:160px;height:80px;background:#0a0a0a;border:1px solid rgba(245,243,239,.06);display:flex;align-items:center;justify-content:center;padding:1rem 1.5rem;cursor:pointer;transition:background .2s,border-color .2s;position:relative;overflow:hidden}
.sponsor-logo:hover,.sponsor-logo.active{background:#111;border-color:rgba(200,16,46,.25)}
.sponsor-logo img{max-width:100%;max-height:40px;object-fit:contain;filter:grayscale(1) brightness(1.8);transition:filter .3s;display:block}
.sponsor-logo:hover img,.sponsor-logo.active img{filter:grayscale(0) brightness(1)}
.sponsor-logo-name{font-family:'IBM Plex Mono',monospace;font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,243,239,.35);transition:color .2s}
.sponsor-logo:hover .sponsor-logo-name,.sponsor-logo.active .sponsor-logo-name{color:rgba(245,243,239,.7)}
</style>
